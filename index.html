<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>週刊誌風サムネイルジェネレーター</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app" class="container mx-auto px-4 py-8 max-w-7xl">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">週刊誌風サムネイルジェネレーター</h1>
      <p class="text-gray-600">ニュースやテキストを中吊り広告風サムネイルに変換</p>
    </header>

    <!-- API Keys Section -->
    <section id="api-keys-section" class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <span>🔑</span> API設定
        <button id="toggle-api-keys" class="ml-auto text-sm text-blue-600 hover:text-blue-800">表示/非表示</button>
      </h2>
      <div id="api-keys-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Firecrawl API Key</label>
          <input type="password" id="firecrawl-key" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="fc-..." />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Gemini API Key</label>
          <input type="password" id="gemini-key" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="AIza..." />
        </div>
        <div class="flex items-end">
          <button id="save-keys" class="w-full bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 transition">キーを保存</button>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-2">※ APIキーはブラウザのlocalStorageにのみ保存されます</p>
    </section>

    <!-- Input Section -->
    <section class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">📝 入力</h2>

      <!-- Input Tabs -->
      <div class="flex border-b border-gray-200 mb-4">
        <button class="input-tab active px-4 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600" data-tab="url">URL</button>
        <button class="input-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="file">ファイル</button>
        <button class="input-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="text">テキスト</button>
      </div>

      <!-- URL Input -->
      <div id="url-input" class="input-content">
        <input type="url" id="url-field" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com/article" />
      </div>

      <!-- File Input -->
      <div id="file-input" class="input-content hidden">
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
          <input type="file" id="file-field" accept=".txt,.md" class="hidden" />
          <label for="file-field" class="cursor-pointer">
            <span class="text-gray-600">クリックしてファイルを選択</span>
            <span class="block text-sm text-gray-400 mt-1">(.txt, .md)</span>
          </label>
          <p id="file-name" class="mt-2 text-sm text-blue-600"></p>
        </div>
      </div>

      <!-- Text Input -->
      <div id="text-input" class="input-content hidden">
        <textarea id="text-field" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ニュース記事やテキストをここに貼り付け..."></textarea>
      </div>
    </section>

    <!-- Options Section -->
    <section class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">⚙️ オプション</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">アスペクト比</label>
          <select id="aspect-ratio" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="1:1.91">1:1.91 (OGP)</option>
            <option value="16:9">16:9 (YouTube)</option>
            <option value="1:1">1:1 (Instagram)</option>
            <option value="4:5">4:5 (Instagram縦)</option>
            <option value="9:16">9:16 (ストーリーズ)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">生成枚数: <span id="count-value">4</span>枚</label>
          <input type="range" id="generation-count" min="4" max="10" value="4" class="w-full" />
        </div>
      </div>
    </section>

    <!-- Generate Button -->
    <div class="text-center mb-6">
      <button id="generate-btn" class="bg-red-600 text-white text-xl font-bold py-4 px-12 rounded-lg hover:bg-red-700 transition shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed">
        サムネイルを生成
      </button>
    </div>

    <!-- YAML Editor Section -->
    <section id="yaml-section" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        📄 YAMLプラン
        <button id="regenerate-btn" class="ml-auto bg-blue-600 text-white text-sm py-2 px-4 rounded-md hover:bg-blue-700 transition">YAMLから再生成</button>
      </h2>
      <textarea id="yaml-editor" rows="20" class="w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"></textarea>
    </section>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center py-8">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
      <p id="loading-text" class="mt-4 text-gray-600">処理中...</p>
    </div>

    <!-- Gallery Section -->
    <section id="gallery-section" class="bg-white rounded-lg shadow-md p-6 hidden">
      <h2 class="text-xl font-semibold mb-4">🖼️ 生成結果</h2>
      <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- Footer -->
    <footer class="text-center mt-8 text-gray-500 text-sm">
      <p>Magazine Thumbnail Generator - 静的サイトとしてデプロイ可能</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
